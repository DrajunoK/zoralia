<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zoralia — le dessert animé (scène pilotée par le temps)</title>
<style>
@font-face{font-family:"Bungee";src:url("assets/bungee-latin.woff2") format("woff2")}
@font-face{font-family:"Fredoka";src:url("assets/fredoka-latin.woff2") format("woff2");font-weight:300 700}
:root{--ink:#4a4266;--pri:#ff9f1c;--second:#2f7d5b;--gold:#ffc93c}
*{box-sizing:border-box}html,body{margin:0;background:#111}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font:600 26px/1.2 "Fredoka",system-ui,sans-serif;color:var(--ink);background:#8fe0ff}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
svg{overflow:visible}
img{display:block}
#bg{position:absolute;inset:0}
.cloud{position:absolute;font-size:90px;opacity:.9;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06))}
.tablet{position:absolute;left:560px;top:56px;width:660px;height:610px;border-radius:44px;background:#26203a;padding:16px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.screen{width:100%;height:100%;border-radius:30px;background:linear-gradient(180deg,#d6efe5,#c4e8d6);padding:16px 18px;overflow:hidden;position:relative}
.hbar{display:flex;align-items:center;gap:12px;height:62px}
.av{width:52px;height:52px;border-radius:50%;background:#f6b73c;display:grid;place-items:center;font-size:30px;box-shadow:0 0 0 3px #fff inset,0 4px 10px rgba(0,0,0,.15)}
.who{font:700 28px "Fredoka"}.pills{margin-left:auto;display:flex;gap:10px}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:3px 14px 3px 8px;font:700 26px "Fredoka";box-shadow:0 4px 10px rgba(0,0,0,.12)}
.pill img{width:36px;height:36px}
.card{background:#fff;border-radius:26px;padding:14px 16px;box-shadow:0 10px 26px rgba(40,90,70,.18)}
.ctitle{display:flex;align-items:center;justify-content:space-between;font:700 26px "Fredoka"}
.gauge{height:14px;border-radius:99px;background:#dbe8e2;margin:8px 0 6px;overflow:hidden}.gauge i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffc77a,#ff9f1c)}
.row{display:flex;align-items:center;gap:14px;height:104px;border-top:2px solid #eef3f0;position:relative}
.row:first-of-type{border-top:0}
.ic{width:62px;font-size:50px;text-align:center;filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.rt{flex:1;line-height:1.1}.rt b{font-size:27px;display:block}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff1cf;border-radius:99px;padding:0 12px 0 6px;font:700 22px "Fredoka";margin-top:4px}.chip img{width:28px;height:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:12px 24px;font:700 25px "Fredoka";color:#3b2f1a;background:linear-gradient(180deg,#ffc27a,#ff9f1c);box-shadow:0 8px 18px rgba(255,159,28,.45);white-space:nowrap}
.st{font:700 24px "Fredoka";color:#8d86a6;white-space:nowrap}.st.ok{color:#2a8a4a}
.rowbg{position:absolute;inset:6px -8px;border-radius:20px;background:#d9ffe6;opacity:0;z-index:0}.row>*:not(.rowbg){position:relative;z-index:1}
.chapter{position:absolute;left:34px;top:30px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:6px 24px 6px 14px;font:700 32px "Fredoka";box-shadow:0 8px 20px rgba(0,0,0,.18)}
.chapter span{font-size:40px}
.bubble{position:absolute;background:#fff;border-radius:28px;padding:12px 22px;font:700 34px "Fredoka";box-shadow:0 10px 24px rgba(0,0,0,.2)}
.big{position:absolute;left:0;right:0;text-align:center;font-family:"Bungee";color:#fff;-webkit-text-stroke:8px #2b1a2e;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.heroes{position:absolute;left:300px;top:70px;width:930px;height:580px;border-radius:50px;padding:26px 32px;color:#fff;background:linear-gradient(140deg,#ff9f1c,#ff7fa8 55%,#8b5cf6);box-shadow:0 24px 50px rgba(139,92,246,.45);overflow:hidden;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.heroes h2{margin:0;font:400 54px "Bungee"}.heroes p{margin:4px 0 0;font:700 28px "Fredoka"}
.tiles{display:flex;gap:20px;margin-top:26px}.tile{position:relative;flex:1;height:340px;border-radius:30px;background:#fffdfd;color:var(--ink);text-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:700 24px/1.15 "Fredoka";text-align:center;padding:10px 10px}
.tile .e{font-size:92px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.14))}.tile .bt{margin-top:6px;font-size:21px;padding:8px 16px}
.pts{position:absolute;top:-14px;right:-12px;display:flex;align-items:center;gap:4px;background:var(--gold);color:#3b2f1a;border-radius:99px;padding:3px 16px 3px 8px;font:800 30px "Fredoka";box-shadow:0 6px 14px rgba(0,0,0,.25)}.pts img{width:42px;height:42px}
.shop{position:absolute;left:300px;top:70px;width:930px;height:590px;border-radius:44px;background:linear-gradient(180deg,#e3f6c8,#c9ebd8);padding:22px 28px;box-shadow:0 24px 50px rgba(0,0,0,.25)}
.banner{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 20px;color:#fff;font:700 30px "Fredoka";text-shadow:0 2px 3px rgba(0,0,0,.25);margin-bottom:18px}
.cards{display:flex;gap:22px}.rcard{position:relative;flex:1;height:410px;border-radius:32px;background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;font:700 28px/1.15 "Fredoka"}
.rcard .e{font-size:110px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.14))}.rcard .pr{display:inline-flex;align-items:center;gap:6px;background:#fff1cf;border-radius:99px;padding:2px 18px 2px 8px;font:800 32px "Fredoka"}.rcard .pr img{width:44px;height:44px}
#mapwrap{position:absolute;inset:0}
.node{position:absolute;width:62px;height:62px;border-radius:50%;background:#fff7df;border:5px solid #4a4266;display:grid;place-items:center;font:700 27px "Fredoka";box-shadow:0 5px 0 rgba(0,0,0,.25);margin:-31px 0 0 -31px}
.node.done{background:#ffc93c}
#hero{position:absolute;width:92px;height:92px;margin:-54px 0 0 -46px;border-radius:50%;background:#f6b73c;display:grid;place-items:center;font-size:56px;box-shadow:0 0 0 7px #fff,0 0 0 13px var(--pri),0 12px 0 rgba(0,0,0,.25)}
#herotag{position:absolute;margin:-104px 0 0 -52px;background:#4a4266;color:#fff;font:700 24px "Fredoka";border-radius:12px;padding:2px 14px}
.zone{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:8px 22px 8px 14px;font:700 32px "Fredoka";box-shadow:0 8px 20px rgba(0,0,0,.2)}.zone span{font-size:44px}
#fxc{position:absolute;inset:0;pointer-events:none}
.flyimg{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px}
.counter{position:absolute;right:40px;top:30px;display:flex;gap:12px}
.sign{position:absolute;display:grid;place-items:center;font-size:130px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.2))}
</style>
</head>
<body>

<script src="timeline.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inOut: (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  bounce: (x) => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; },
};
const lerp = (a, b, k) => a + (b - a) * k;
function tf(el, { x = 0, y = 0, r = 0, s = 1, sx, sy, o } = {}) {
  if (!el) return;
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`;
  if (o !== undefined) el.style.opacity = o;
}
const S = Object.fromEntries(TIMELINE.scenes.map((s) => [s.id, s]));
const at = (id, cue) => S[id].start + (cue ? S[id].cues[cue] : 0);
const show = (el, on) => { if (el) el.style.display = on ? '' : 'none'; };
const sceneAt = (t) => TIMELINE.scenes.find((s) => t >= s.start - 0.01 && t < s.end) ?? TIMELINE.scenes[TIMELINE.scenes.length - 1];

/* fond d'aventure */
const bg = $('#bg');
bg.innerHTML = `
<svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset="1" stop-color="#e2f7ea"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fff7b0"/><stop offset="1" stop-color="#ffd24a"/></radialGradient></defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="1120" cy="110" r="120" fill="#fff6b0" opacity=".35"/><circle cx="1120" cy="110" r="70" fill="url(#sun)"/>
  <path d="M0 470 Q200 380 420 450 T820 440 T1280 430 V720 H0Z" fill="#7fd08f"/>
  <path d="M0 540 Q260 470 520 530 T1040 520 T1280 500 V720 H0Z" fill="#5cc27a"/>
  <path d="M0 640 Q300 590 640 630 T1280 610 V720 H0Z" fill="#46b268"/>
  <g id="trees"></g>
</svg>
<div class="cloud" id="c1" style="top:60px">☁️</div><div class="cloud" id="c2" style="top:150px;font-size:70px">☁️</div><div class="cloud" id="c3" style="top:40px;font-size:110px">☁️</div>`;
const TREES = [[60, 520, 1.1], [200, 560, .9], [350, 500, .7], [900, 520, .8], [1040, 560, 1.1], [1190, 510, .9], [600, 480, .6], [760, 470, .55]];
$('#trees', bg).innerHTML = TREES.map(([x, y, k], i) => `<g class="tree" data-i="${i}"><rect x="-8" y="0" width="16" height="50" rx="6" fill="#8a5a2a"/><path d="M-50 10 L0 -90 L50 10Z" fill="#2f9e5a" stroke="#1c6e3c" stroke-width="5" stroke-linejoin="round"/><path d="M-42 -30 L0 -120 L42 -30Z" fill="#37b068" stroke="#1c6e3c" stroke-width="5" stroke-linejoin="round"/></g>`).join('');
function drawBg(t) {
  [['c1', 100], ['c2', 700], ['c3', 1000]].forEach(([id, x0], i) => { $('#' + id).style.left = (((x0 + t * (22 - i * 6)) % 1500) - 150) + 'px'; });
  document.querySelectorAll('.tree').forEach((g) => { const i = +g.dataset.i, [x, y, k] = TREES[i]; g.setAttribute('transform', `translate(${x} ${y}) scale(${k}) rotate(${Math.sin(t * 1.6 + i) * 1.6} 0 40)`); });
}

/* le renard */
const fox = $('#fox');
function drawFox(t, o) {
  show(fox, o.vis); if (!o.vis) return;
  const hop = o.hop ? -Math.abs(Math.sin(t * 7)) * 34 : 0;
  tf(fox, { x: o.x, y: o.y + Math.sin(t * 5) * 3 + hop, sx: o.flip ? -o.s : o.s, sy: o.s });
  $('#fx-tail').style.transform = `rotate(${Math.sin(t * 6) * 9}deg)`;
  $('#fx-arm').style.transform = `rotate(${(o.armUp || 0) + (o.wave ? Math.sin(t * 9) * 16 : 0)}deg)`;
  $('#fx-head').style.transform = `rotate(${Math.sin(t * 3) * 2.4 + (o.tilt || 0)}deg)`;
  const eyes = $('#fx-eyes'); eyes.style.transformOrigin = '100px 90px'; eyes.style.transform = `scaleY(${(t % 3.2) > 3.08 ? 0.12 : 1})`;
}

/* tablette */
const ROWS = [['🍽️', 'Mettre la table'], ['🪥', 'Je me brosse les dents'], ['🧸', 'Ranger ma chambre']];
$('#rows').innerHTML = ROWS.map(([e, ti], i) => `<div class="row" id="row${i}"><div class="rowbg" id="rbg${i}"></div><div class="ic">${e}</div><div class="rt"><b>${ti}</b><span class="chip"><img src="../public/icons/pas.svg" alt="">+1</span></div><div id="act${i}"></div></div>`).join('');
const BTN = '<span class="btn">J’ai terminé !</span>';

/* carte : 3 rangées de 7 cases en serpentin */
const COLS = 7, X0 = 170, DX = 156, ROWY = [585, 395, 215];
const CELL = (i) => { const r = Math.floor((i - 1) / COLS), k = (i - 1) % COLS, x = X0 + (r % 2 === 0 ? k : COLS - 1 - k) * DX; return [x, ROWY[r] + Math.sin(k * 0.95 + r * 1.9) * 14]; };
const mapw = $('#mapwrap');
function smooth(pts) { let d = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)]; d += `C${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`; } return d; }
const turn = (n) => (n === 7 ? [CELL(7)[0] + 60, (CELL(7)[1] + CELL(8)[1]) / 2] : n === 14 ? [CELL(14)[0] - 60, (CELL(14)[1] + CELL(15)[1]) / 2] : null);
const upto = (n) => { const out = []; for (let i = 1; i <= n; i++) { out.push(CELL(i)); if (i < n && turn(i)) out.push(turn(i)); } return out; };
const FULL = smooth(upto(21));
mapw.innerHTML = `
<svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0">
  <rect width="1280" height="720" fill="rgba(255,255,255,.18)"/>
  <path d="M-20 330 C 300 270 500 400 760 330 S 1200 280 1320 330" stroke="#3fa9e0" stroke-width="64" fill="none" stroke-linecap="round"/>
  <path d="M-20 330 C 300 270 500 400 760 330 S 1200 280 1320 330" stroke="#79d0f7" stroke-width="44" fill="none" stroke-linecap="round"/>
  <path id="riverflow" d="M-20 330 C 300 270 500 400 760 330 S 1200 280 1320 330" stroke="#fff" stroke-opacity=".8" stroke-width="4" stroke-dasharray="10 34" fill="none" stroke-linecap="round"/>
  <path d="${FULL}" fill="none" stroke="#6b4a2a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="${FULL}" fill="none" stroke="#f6e2b4" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="goldline" d="" fill="none" stroke="#6b4a2a" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <path id="goldline2" d="" fill="none" stroke="#ffc93c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div id="cells"></div>
<div class="zone" id="z1" style="left:60px;top:470px"><span>🌲</span>Forêts</div>
<div class="zone" id="z2" style="left:560px;top:292px"><span>🌊</span>Rivières</div>
<div class="zone" id="z3" style="left:980px;top:100px"><span>⛰️</span>Montagnes</div>
<div id="hero">🦊</div><div id="herotag">TOI !</div>
<div class="counter" id="mapcount"><div class="pill"><img src="../public/icons/pas.svg" alt=""><span id="mc-steps">0</span></div><div class="pill" id="mc-pep-pill"><img src="../public/icons/pepite.svg" alt=""><span id="mc-pep">0</span></div></div>

/* particules déterministes */
const cx = $('#fxc').getContext('2d');
const BURSTS = [];
const rnd = (seed) => { const v = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const burst = (t, x, y, n = 28, kind = 'confetti') => BURSTS.push({ t, x, y, n, kind });
const COLS_C = ['#ff5a8a', '#ffc93c', '#3ecf7a', '#4aa8f0', '#8b5cf6', '#ff7a45'];
function drawParticles(t) {
  cx.clearRect(0, 0, 1280, 720);
  for (const b of BURSTS) {
    const dt = t - b.t; if (dt < 0 || dt > 1.8) continue;
    for (let i = 0; i < b.n; i++) {
      const a = rnd(i * 3.1 + b.t) * Math.PI * 2, sp = 160 + rnd(i * 7.7 + b.t) * 360 * (b.kind === 'star' ? .55 : 1);
      const x = b.x + Math.cos(a) * sp * dt, y = b.y + Math.sin(a) * sp * dt + 420 * dt * dt * (b.kind === 'star' ? .25 : 1);
      cx.globalAlpha = 1 - ramp(dt, 1.0, 1.8); cx.fillStyle = b.kind === 'star' ? '#fff6b0' : COLS_C[i % COLS_C.length];
      cx.save(); cx.translate(x, y); cx.rotate(dt * (4 + i % 5));
      if (b.kind === 'star') { cx.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? 5 : 15, an = k * Math.PI / 4; cx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } cx.closePath(); cx.fill(); } else cx.fillRect(-7, -4, 14, 8);
      cx.restore();
    }
  }
  cx.globalAlpha = 1;
}

    if (sOn) tf($('#nosign'), { s: Math.max(.001, E.back(ramp(t, at('jamais', 'jamais') - .1, at('jamais', 'jamais') + .4))), r: Math.sin(t * 6) * 3 });
    const bOn = inJ && t >= at('jamais', 'toi') - .2; show($('#alltoyou'), bOn);
    if (bOn) tf($('#alltoyou'), { s: Math.max(.001, E.back(ramp(t, at('jamais', 'toi') - .2, at('jamais', 'toi') + .3))), y: (1 - E.out(ramp(t, at('jamais', 'toi') - .2, at('jamais', 'toi') + .3))) * 40 });
    if (!inJ) { show($('#nosign'), false); show($('#alltoyou'), false); }
    $('#mapcount').style.display = '';
  } else { show(chestBig, false); flyPep.forEach((e) => show(e, false)); }

  /* boutique */
  const shop = $('#shop'), shopOn = t >= S.boutique.start - .3 && t < S.boutique.end + .3; show(shop, shopOn);
  if (shopOn) {
    const enter = E.out(ramp(t, S.boutique.start - .3, S.boutique.start + .4)), exit = E.inOut(ramp(t, S.boutique.end - .2, S.boutique.end + .3));
    tf(shop, { y: (1 - enter) * 700 + exit * 700 });
    ['tele', 'bowling', 'pyjama'].forEach((c, i) => { const k = E.back(ramp(t, at('boutique', c) - .3, at('boutique', c) + .2)), pulse = t > at('boutique', c) + .2 && t < at('boutique', c) + .9 ? Math.sin(ramp(t, at('boutique', c) + .2, at('boutique', c) + .9) * Math.PI) * .07 : 0; tf($('#rc' + i), { s: Math.max(.001, k) + pulse, o: ramp(t, at('boutique', c) - .3, at('boutique', c) - .1), y: Math.sin(t * 2.4 + i) * 4 }); });
  }

  /* défis héroïques */
  const hp = $('#heroes'), hOn = t >= S.defis.start - .3 && t < S.defis.end + .3; show(hp, hOn);
  if (hOn) {
    const enter = E.out(ramp(t, S.defis.start - .3, S.defis.start + .4)), exit = E.inOut(ramp(t, S.defis.end - .2, S.defis.end + .3));
    tf(hp, { x: (1 - enter) * 1300 + exit * -1300, r: (1 - enter) * 6 });
    HEROES.forEach((_, i) => { const t0 = S.defis.start + .5 + i * .45; tf($('#ht' + i), { s: Math.max(.001, E.back(ramp(t, t0, t0 + .35))), o: ramp(t, t0, t0 + .1), y: Math.sin(t * 3 + i) * 3 }); });
  }

  /* fin */
  const endOn = id === 'fin'; show($('#endlogo'), endOn); show($('#endtitle'), endOn); show($('#endtag'), endOn);
  if (endOn) {
    tf($('#endlogo'), { s: Math.max(.001, E.back(ramp(lt, 0, .6))), y: Math.sin(t * 3) * 6 });
    const kz = E.back(ramp(t, at('fin', 'zoralia'), at('fin', 'zoralia') + .4)); tf($('#endtitle'), { s: Math.max(.001, kz), o: ramp(t, at('fin', 'zoralia'), at('fin', 'zoralia') + .1) });
    tf($('#endtag'), { o: ramp(t, at('fin', 'aventure') - .2, at('fin', 'aventure') + .5), y: (1 - E.out(ramp(t, at('fin', 'aventure') - .2, at('fin', 'aventure') + .5))) * 40 });
  }
  drawParticles(t);
}
window.seek = seek;
const qs = new URLSearchParams(location.search);
seek(qs.has('t') ? +qs.get('t') : 0);
</script>
